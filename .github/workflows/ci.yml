name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  lint:
    name: Lint (mypy + ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Installer les dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Vérifier les imports
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from src.config import settings; print(f'Config: OK ({settings.host}:{settings.port})')
          "

      - name: Ruff — vérification du style (src/)
        run: |
          python -m ruff check src/ --no-cache

      - name: Vérifier les marqueurs qt_heavy sur les tests
        run: |
          python scripts/check_qt_heavy_markers.py

      - name: Ruff — vérification du style (tests/)
        run: |
          python -m ruff check tests/ --no-cache

      - name: Ruff — vérification du formatage
        run: |
          python -m ruff format --check src/ tests/ --no-cache

      - name: Mypy — vérification du typage (src/)
        continue-on-error: true
        run: |
          python -m mypy src/ --no-error-summary

      - name: Mypy — vérification du typage (tests/)
        continue-on-error: true
        run: |
          python -m mypy tests/ --no-error-summary

      - name: Résumé des violations
        if: always()
        run: |
          echo "=== Ruff (src/) ==="
          SRC_RUFF=$(python -m ruff check src/ --no-cache --output-format concise 2>&1 | grep -c ':' || true)
          echo "Violations: $SRC_RUFF"

          echo "=== Ruff (tests/) ==="
          TEST_RUFF=$(python -m ruff check tests/ --no-cache --output-format concise 2>&1 | grep -c ':' || true)
          echo "Violations: $TEST_RUFF"

          echo "=== Ruff format ==="
          if python -m ruff format --check src/ tests/ --no-cache 2>&1 | grep -q "would reformat\|Would reformat"; then
            FORMAT_ERRORS=$(python -m ruff format --check src/ tests/ --no-cache 2>&1 | grep -c "would reformat\|Would reformat")
            echo "Fichiers non formatés: $FORMAT_ERRORS"
          else
            echo "Fichiers non formatés: 0"
          fi

          echo "=== Mypy (src/) ===
          SRC_MYPY=$(python -m mypy src/ --no-error-summary 2>&1 | grep -c "error:" || true)
          echo "Erreurs: $SRC_MYPY"

          echo "=== Mypy (tests/) ==="
          TEST_MYPY=$(python -m mypy tests/ --no-error-summary 2>&1 | grep -c "error:" || true)
          echo "Erreurs: $TEST_MYPY"

          echo ""
          echo "Résumé : Ruff($SRC_RUFF/$TEST_RUFF) | Format($FORMAT_ERRORS) | Mypy($SRC_MYPY/$TEST_MYPY)"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Installer les dépendances système (PySide6)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xkb1 \
            libxkbcommon0 \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
          || echo "Certains paquets peuvent manquer — tentative de poursuite"

      - name: Installer les dépendances Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Vérifier les imports
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from src.config import settings; print(f'Config: OK ({settings.host}:{settings.port})')
          from fastapi import FastAPI; print('FastAPI: OK')
          from PySide6.QtWidgets import QApplication; print('PySide6: OK')
          from aioslsk.client import SoulSeekClient; print('aioslsk: OK')
          "

      - name: Lancer les tests unitaires et d'intégration
        run: |
          python -m pytest \
            -v \
            -o "addopts=" \
            --ignore=tests/test_e2e_web.py \
            --timeout=60 \
            --cov=src \
            --cov-report=xml \
            --cov-append \
            tests/

      - name: Lancer les tests E2E web
        run: |
          echo "=== Tests E2E Web ==="
          python -m pytest tests/test_e2e_web.py \
            -v \
            -o "addopts=" \
            --timeout=30 \
            --cov=src \
            --cov-report=xml \
            --cov-append

      - name: Uploader la couverture vers Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Collecter les logs en cas d'échec
        if: failure()
        run: |
          echo "=== Pytest cache ==="
          ls -la .pytest_cache/ 2>/dev/null || echo "Pas de cache"
          echo "=== Logs ==="
          find /tmp -name "*.log" -type f 2>/dev/null | head -10
          for f in $(find /tmp -name "*.log" -type f 2>/dev/null | head -10); do
            echo "--- $f ---"
            cat "$f" 2>/dev/null || true
          done
